[package]
name = "mail-dfir"
version = "1.0.0"
edition = "2021"
publish = false
description = "MailSonar email forensics and incident-response workbench"
license = "MIT"
authors = ["MailSonar"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
sha2 = "0.10"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
mailparse = "0.15"
calamine = "0.38"
evtx = "0.15"
cfb = "0.10"
roxmltree = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
chrono = "0.4"
rusqlite = { version = "0.43", features = ["bundled"] }
tokio = { version = "1", features = ["time", "fs", "sync", "rt-multi-thread"] }
sysinfo = "0.40"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
