# cargo-deny policy for MailSonar.
#
# The allow list below is the set of OSI-approved licenses that already appear
# in the dependency graph. It is deliberately explicit: a new dependency that
# introduces a different license fails the check until a human reviews it.
#
# Run from src-tauri: cargo deny check

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
  # chrono is unmaintained but has no fixed release. It is used only for
  # timestamp formatting in local case files; no untrusted input is parsed
  # with it. Tracked until an upstream replacement is adopted.
  "RUSTSEC-2026-0543",
  # proc-macro-error is a build-time-only dependency pulled in by a proc-macro
  # used during compilation. It never ships in the application binary.
  "RUSTSEC-2024-0370",
  # glib is a transitive Linux/WebKitGTK dependency of Tauri. The advisory is
  # an Iterator/DoubleEndedIterator unsoundness in an API this application
  # does not call. Windows builds do not include it.
  "RUSTSEC-2024-0429",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "0BSD",
  "CC0-1.0",
  "MIT-0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
]
# The application crate itself is not published and has no license field.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  # No crate may pull in a second copy of the cryptographic primitives under a
  # different name than the audited one.
  { name = "openssl" },
  { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
